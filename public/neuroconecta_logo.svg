<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradients for Brain & Text -->
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="greenYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <linearGradient id="orangeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <g transform="translate(300, 180)">
    <!-- Rainbow Brain Outer Silhouette -->
    <!-- Left Hemisphere Puzzle Blocks -->
    <path d="M -130,-40 C -150,-20 -150,20 -130,40 C -120,50 -100,50 -90,40 C -80,30 -80,10 -90,0 C -100,-10 -110,-30 -130,-40 Z" fill="url(#blueCyan)" />
    <path d="M -120,-80 C -100,-120 -40,-130 -10,-110 C 0,-100 -20,-80 -40,-80 C -60,-80 -70,-90 -90,-80 Z" fill="url(#purplePink)" />
    <path d="M -135,10 C -150,40 -140,80 -100,100 C -80,110 -70,90 -80,70 C -90,50 -110,30 -135,10 Z" fill="url(#greenYellow)" />
    <path d="M -90,80 C -60,120 -10,130 10,100 C 0,80 -20,80 -40,90 Z" fill="url(#orangeRed)" />

    <!-- Center Connected Hugging Heart & Community Silhouette -->
    <path d="M -40,30 C -60,10 -60,-20 -30,-40 C 0,-60 30,-30 0,20 C -20,40 -30,40 -40,30 Z" fill="none" stroke="url(#cyanGreen)" stroke-width="12" stroke-linecap="round" />
    <path d="M 40,30 C 60,10 60,-20 30,-40 C 0,-60 -30,-30 0,20 C 20,40 30,40 40,30 Z" fill="none" stroke="url(#cyanGreen)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Central People Figures -->
    <circle cx="0" cy="-35" r="14" fill="#0f172a" />
    <path d="M -25,10 C -25,-15 25,-15 25,10 C 25,30 -25,30 -25,10 Z" fill="#0f172a" />

    <circle cx="-45" cy="-10" r="10" fill="#8b5cf6" />
    <circle cx="45" cy="-10" r="10" fill="#06b6d4" />

    <!-- Right Hemisphere Outline & Inner Icons -->
    <path d="M 10,-110 C 80,-130 140,-80 140,-20 C 140,40 100,100 20,110" fill="none" stroke="url(#cyanGreen)" stroke-width="10" stroke-linecap="round" />

    <!-- Mini Floating Icons on Right Hemisphere -->
    <!-- Health / Cross -->
    <g transform="translate(80, -70)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#0ea5e9" stroke-width="3" />
      <path d="M -6,0 H 6 M 0,-6 V 6" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Community / People -->
    <g transform="translate(110, -20)">
      <circle cx="0" cy="-6" r="5" fill="#8b5cf6" />
      <circle cx="-10" cy="-2" r="4" fill="#ec4899" />
      <circle cx="10" cy="-2" r="4" fill="#06b6d4" />
    </g>

    <!-- Education / Cap -->
    <g transform="translate(100, 30)">
      <path d="M -12,-2 L 0,-8 L 12,-2 L 0,4 Z" fill="#0284c7" />
      <path d="M -7,2 V 8 C -7,10 7,10 7,8 V 2" fill="none" stroke="#0284c7" stroke-width="2" />
    </g>

    <!-- Family / Home -->
    <g transform="translate(70, 75)">
      <path d="M -10,2 L 0,-8 L 10,2 V 10 H -10 Z" fill="none" stroke="#f97316" stroke-width="3" />
    </g>
  </g>

  <!-- Typography: NeuroConecta -->
  <g transform="translate(300, 390)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="62" letter-spacing="-1">
      <tspan fill="#0f172a">Neuro</tspan><tspan fill="#8b5cf6">Co</tspan><tspan fill="#10b981">nec</tspan><tspan fill="#f97316">ta</tspan>
    </text>
    <text y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="#64748b" letter-spacing="4">
      PLATA FORMA NEUROAFIRMATIVA TEA &amp; TDAH
    </text>
  </g>
</svg>
